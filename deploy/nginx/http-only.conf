server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name qa-app.eastasia.cloudapp.azure.com;

    include /opt/autoqa/nginx/acme.conf;

    location / {
        add_header Retry-After 120 always;
        return 503 "HTTPS setup is pending. Please try again later.\n";
    }
}
