server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name qa-app.eastasia.cloudapp.azure.com;

    include /opt/autoqa/nginx/acme.conf;

    location / {
        return 308 https://qa-app.eastasia.cloudapp.azure.com$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    server_name qa-app.eastasia.cloudapp.azure.com;
    root /var/www/html/public;
    index index.php;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/qa-app.eastasia.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qa-app.eastasia.cloudapp.azure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AutoQATLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_FORWARDED "";
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_X_FORWARDED_PREFIX "";
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $autoqa_fpm app:9000;
        fastcgi_pass $autoqa_fpm;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        return 404;
    }
}
